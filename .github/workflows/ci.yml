name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor
      - run: pnpm -r run lint
      - run: pnpm -r run test
      - run: pnpm -r run build

  integration-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/integration/contract.test.ts

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run test
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/.coverage/v8
      - run: pnpm coverage:summary .coverage/v8
        env:
          DSP_COVERAGE_MIN_FUNCTIONS: "0.35"
      - uses: actions/upload-artifact@v4
        with:
          name: v8-coverage
          path: .coverage

  bench-smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:smoke > bench-results.json
        env:
          DSP_BENCH_CASES: tiny
          DSP_BENCH_PARALLELISM: "1,4"
      - run: pnpm bench:compare bench-results.json bench/baselines/ci-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-results
          path: bench-results.json

  bench-medium:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:smoke > bench-medium-results.json
        env:
          DSP_BENCH_CASES: tiny,medium
          DSP_BENCH_PARALLELISM: "1,4"
      - run: pnpm bench:compare bench-medium-results.json bench/baselines/main-medium.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-medium-results
          path: bench-medium-results.json

  bench-soak:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:soak > bench-soak-results.json
        env:
          DSP_BENCH_CASES: tiny,medium
          DSP_BENCH_PARALLELISM: "1,4,8"
          DSP_BENCH_REPEATS: "3"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-soak-results
          path: bench-soak-results.json
